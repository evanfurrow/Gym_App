<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gym Lift Tracker - Start</title>
</head>
<body>
    <h1>Start Your Workout Session</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}


    <form method="POST" action="/">
        <label for="user_name">Your Name:</label>
        <input type="text" name="user_name" id="user_name" required><br><br>

        <button type="submit">Start Log Lifts</button>
    </form>
</body>
</html>
